<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NWS WWAs</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src='https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js'></script>
  <script>

    async function fetchWithCORSProxy(url) {
      const corsProxyUrl = 'https://api.allorigins.win/get?url=';
      const proxiedUrl = corsProxyUrl + encodeURIComponent(url);
      const response = await fetch(proxiedUrl);
      const data = await response.json();

      // allorigins encodes binary/non-HTML responses as base64 data URIs:
      // "data:<mime>;base64,<payload>" — decode before handing to JSON.parse
      let contents = data.contents;
      if (typeof contents === 'string' && contents.startsWith('data:')) {
        contents = atob(contents.split(',')[1]);
      }
      return new Response(contents, { headers: { 'Content-Type': 'application/json' } });
    }


    async function addShapefileToMap(shapefileUrl, map) {
      try {
        console.log('Loading shapefile:', shapefileUrl); // Add logging statement
        const response = await fetch(shapefileUrl);
        const arrayBuffer = await response.arrayBuffer();
        const geojson = await shp(arrayBuffer);
        console.log('Shapefile loaded, adding to map:', geojson); // Add logging statement

        const layerGroup = L.layerGroup().addTo(map); // Create a layer group for the polygons

        L.geoJSON(geojson, {
          style: {
            color: 'black',
            weight: 2,
            fillColor: 'yellow',
            fillOpacity: 0.2,
          },
          onEachFeature: function(feature, layer) { // Add a click event listener to each polygon layer
            layer.on('click', function() {
              layer.bindPopup(JSON.stringify(feature.properties.NAME)).openPopup();
            });
          }
        }).addTo(layerGroup);
      } catch (error) {
        console.error('Error adding shapefile to map:', error);
      }
    }

    // Returns an object of { 'Day N Outlook': layerGroup } so the caller can
    // merge them into the shared Leaflet layer control.
    async function fetchSPCOutlooks() {
      const baseLink = 'https://www.spc.noaa.gov/products/outlook/day';
      const overlays = {};

      for (let day = 1; day <= 3; day++) {
        const layerGroup = L.layerGroup();
        const geojsonUrl = `${baseLink}${day}otlk_cat.nolyr.geojson`;
        try {
          const response = await fetchWithCORSProxy(geojsonUrl);
          const geojson = await response.json();
          L.geoJSON(geojson, {
            style: function (feature) {
              return {
                color: feature.properties.stroke,
                fillColor: feature.properties.fill,
                weight: 2,
                opacity: 1,
                fillOpacity: 0.5,
              };
            },
            onEachFeature: function (feature, layer) {
              layer.on('click', function () {
                layer.bindPopup(feature.properties.LABEL2 || feature.properties.LABEL || '').openPopup();
              });
            },
          }).addTo(layerGroup);
        } catch (err) {
          console.error(`Error loading Day ${day} SPC outlook:`, err);
        }
        overlays[`SPC Day ${day} Outlook`] = layerGroup;
      }

      return overlays;
    }




    // Initialize the map
    const map = L.map('map').setView([27.8742, -81.7814], 8);

    // Add Mapbox tile layer
    const accessToken = 'pk.eyJ1IjoiYW5kcmV3YzMxIiwiYSI6ImNsZnNwbW40OTA0M3czbW83dXkxcThseTgifQ.tphp4wYRnJjSPjwF0qa15g';
    const streetsLayer = L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=' + accessToken, {
      attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> | <a href="https://www.mapbox.com/map-feedback/" target="_blank">Improve this map</a>',
      tileSize: 512,
      maxZoom: 18,
      zoomOffset: -1
    }).addTo(map);

    // Add a satellite layer
    const satelliteLayer = L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/{z}/{x}/{y}?access_token=' + accessToken, {
      attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> | <a href="https://www.mapbox.com/map-feedback/" target="_blank">Improve this map</a>',
      tileSize: 512,
      maxZoom: 18,
      zoomOffset: -1
    });
    // Add a dark layer
    const darkLayer = L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/dark-v10/tiles/{z}/{x}/{y}?access_token=' + accessToken, {
      attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a> | <a href="https://www.mapbox.com/map-feedback/" target="_blank">Improve this map</a>',
      tileSize: 512,
      maxZoom: 18,
      zoomOffset: -1
    });

    // Add basemap layers to control
    const baseMaps = {
      'Streets': streetsLayer,
      'Satellite': satelliteLayer,
      'Dark': darkLayer
    };

    // Add the NWS WWA layer as an overlay (opengeo.ncep.noaa.gov replaced the
    // decommissioned idpgis.ncep.noaa.gov endpoint; hazards = long-duration
    // watches/warnings/advisories, warnings = short-fuse tornado/severe/marine)
    const wmsLayer = L.tileLayer.wms('https://opengeo.ncep.noaa.gov/geoserver/wwa/ows', {
      layers: 'hazards,warnings',
      format: 'image/png',
      transparent: true,
      opacity: 0.5,
      attribution: 'NWS WWAs'
    });

    // Add the Radar tile layer
    const radarLayer = L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', {
      attribution: 'Base Reflectivity © Iowa State University',
      tileSize: 512,
      zoomOffset: -1
    });

    addShapefileToMap('shapefiles/fpl_shp.zip', map);

    // Add streets basemap + WWA layer on load
    wmsLayer.addTo(map);

    // Build unified overlay control: start with always-present layers, then
    // merge in SPC outlooks once they resolve
    const overlays = {
      'NWS WWAs': wmsLayer,
      'Radar': radarLayer,
    };
    const layerControl = L.control.layers(baseMaps, overlays).addTo(map);

    fetchSPCOutlooks().then(function (spcOverlays) {
      Object.entries(spcOverlays).forEach(function ([name, layer]) {
        layerControl.addOverlay(layer, name);
      });
    });

    // Refresh NWS WWA tiles every 15 seconds without removing/re-adding the
    // layer (setParams alone triggers a tile reload; remove+add causes flicker
    // and forcibly re-enables the layer even when the user has turned it off)
    setInterval(function() {
      wmsLayer.setParams({ _ts: Date.now() }, false);
    }, 15000);
  </script>
</body>
</html>
